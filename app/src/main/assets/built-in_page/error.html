            width: 36px;
            height: 36px;

        }

        .error-text {
            color: var(--on-background) !important;
            margin-top: 12px;
        }

        .url {
            word-break: break-all;
            overflow-wrap: anywhere;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions {
            margin-top: 44px;
        }

        .offline-banner {

            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .icon-cloud-off {

            height: 14px;
            fill: var(--on-background) !important;
            flex-shrink: 0;

        .url-text {
            display: inline-block;
        }

        }
